name: tahadi_al_amaliqa
description: "تحدي العمالقة — real-time head-to-head trivia duels between friends."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

# Versions below were the current stable releases on pub.dev as of 2026-09-08.
# See SETUP.md for the full rationale. Run `flutter pub outdated` after you
# pull this down — pub packages move fast and newer patches may exist by the
# time you're building.
dependencies:
  flutter:
    sdk: flutter

  # --- Firebase ---
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  firebase_storage: ^13.0.2

  # --- Sign-in providers ---
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6 # for Apple Sign-In nonce hashing

  # --- State management & routing ---
  flutter_riverpod: ^3.0.1
  go_router: ^17.0.0

  # --- Localization (Arabic default, English secondary; full RTL) ---
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # --- Design system / UI polish ---
  # NOTE: no google_fonts. Titan One / Outfit / Tajawal are bundled as real
  # assets under `fonts:` below so the brand type can never fall back to
  # Roboto because a runtime font fetch failed.
  flutter_animate: ^4.5.2 # declarative micro-interaction animations (reveals, shakes, popups)
  shimmer: ^3.0.0 # branded skeleton loading states
  confetti: ^0.8.0 # duel-won celebration

  # --- Utilities ---
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  connectivity_plus: ^7.3.1

# NOTE: models are hand-written (plain classes with fromJson/toFirestore/
# copyWith) rather than generated with freezed/json_serializable. That's a
# deliberate choice for this project: one fewer build step (no build_runner
# to remember to re-run), and the mapping logic is fully visible in each
# model file instead of a generated .g.dart/.freezed.dart you don't read.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3 # generates the launcher icon — see `flutter_launcher_icons:` below

# Generates the app's launcher icon (what shows on the home screen/app
# drawer after installing the APK — replacing Flutter's default icon) from
# `assets/images/app_icon.png`, the same violet/gold "G" monogram used
# in-app (see `GiantsMonogram` in `lib/core/widgets/giants_logo.dart`).
# `adaptive_icon_foreground`/`adaptive_icon_background` are for Android's
# adaptive icon system specifically: modern Android launchers mask every
# icon into a circle/squircle/rounded-square shape of the *launcher's*
# choosing, so a flat full-bleed image gets its corners clipped
# unpredictably. Splitting the mark into a padded foreground layer plus a
# solid background color keeps the badge fully inside that mask regardless
# of shape, instead of getting cropped in half.
#
# This only edits `assets/images/`; it does NOT touch the generated
# `android`/`ios` folders in this repo (they're gitignored — see
# `RUN_WHEN_HOME.md`). After `flutter create .` generates those locally,
# run `flutter pub get && dart run flutter_launcher_icons` once before
# building the APK to actually generate the icon files from this config.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#140E2A"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true # generates lib/l10n localization classes from l10n.yaml

  assets:
    - assets/images/

  # Bundled rather than fetched at runtime by google_fonts. The brand rests
  # on Titan One specifically — a failed font fetch on a cold, flaky first
  # launch would silently drop the whole identity back to Roboto, and it
  # would look like a broken app rather than a slow one. See AppTypography.
  fonts:
    - family: Titan One
      fonts:
        - asset: assets/fonts/TitanOne-Regular.ttf
    # Outfit ships only as a variable font. Flutter picks the file but does
    # not map `fontWeight` onto the `wght` axis on its own, so AppTypography
    # passes an explicit FontVariation alongside every weight it sets.
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
